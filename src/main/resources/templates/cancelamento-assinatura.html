<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelamento de Assinatura</title>
    <link rel="stylesheet" th:href="@{/css/cancelamento-assinatura.css}">
    <link rel="shortcut icon" href="/imagens/logoWakanda.ico" type="image/x-icon" th:href="@{/imagens/logoWakanda.ico}">
</head>

<body>
<div class="container">

    <div class="form-container">

        <h1>Confirmar Cancelamento de Assinatura</h1>
        <p><strong>Atenção:</strong> neste formulário, informe se deve cancelar a assinatura ou desistir do
            cancelamento.<br>
            <strong>Para manter o acesso, selecione "Desistir do Cancelamento".</strong><br>
            Caso contrário, selecione o motivo e "Cancelar Assinatura" para confirmar.</p>

        <form id="cancelamentoForm">
            <div class="form-group">
                <input type="hidden" id="idWakander" th:value="${wakander.idWakander}" readonly>
            </div>

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:value="${nomeResolvido}" readonly>
            </div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp:</label>
                <input type="text" id="whatsapp" th:value="${contatoResolvido}" readonly>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" th:value="${wakander.contato?.email}" readonly>
            </div>

            <div class="form-group">
                <label for="dataCancelamento">Data do Cancelamento:</label>
                <input
                        type="date"
                        id="dataCancelamento"
                        name="dataCancelamento"
                        readonly
                        required
                >
            </div>

            <div class="form-group">
                <label for="motivoCancelamento">Motivo do Cancelamento:</label>
                <select id="motivoCancelamento" name="motivoCancelamento">
                    <option value="" disabled selected>Selecione um motivo somente para cancelamento.</option>
                    <option value="Falta de tempo para estudar">Falta de tempo para estudar</option>
                    <option value="Dificuldade em entender o conteúdo">Dificuldade em entender o conteúdo</option>
                    <option value="Problemas financeiros">Problemas financeiros</option>
                    <option value="Expectativas não atendidas">Expectativas não atendidas</option>
                    <option value="Metodologia do curso não funcionou para mim">Metodologia do curso não funcionou para
                        mim
                    </option>
                    <option value="Falta de suporte aos alunos">Falta de suporte aos alunos</option>
                    <option value="Conteúdo desatualizado ou pouco prático">Conteúdo desatualizado ou pouco prático
                    </option>
                    <option value="Não consegui aplicar o conhecimento">Não consegui aplicar o conhecimento</option>
                    <option value="Mudança de interesse (outra área de TI ou não-TI)">Mudança de interesse (outra área
                        de TI ou não-TI)
                    </option>
                    <option value="Problemas pessoais ou de saúde">Problemas pessoais ou de saúde</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <button type="submit" name="acao" value="cancelar">Cancelar Assinatura</button>
                <button type="submit" name="acao" value="desistir" class="btn-secondary">Desistir do Cancelamento
                </button>
            </div>

            <div id="loadingSpinner" class="spinner" style="display: none;">
                <div class="spinner-border" role="status">
                    <span class="sr-only"></span>
                </div>
            </div>

            <div id="mensagemFeedback" style="display: none;">

            </div>

        </form>
    </div>
</div>
<script th:src="@{/js/cancelamento-assinatura.js}"></script>
</body>
</html>
