<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Dashboard Wakanders</title>
    <link rel="stylesheet" href="../static/css/login.css" th:href="@{/css/login.css}">
    <link rel="stylesheet" href="../static/css/loading.css" th:href="@{/css/loading.css}">
    <link rel="shortcut icon" href="/imagens/logoWakanda.ico" type="image/x-icon" th:href="@{/imagens/logoWakanda.ico}">
</head>
<body>

<div class="blackscreen">
    <div class="loader"></div>
</div>

<button class="theme-toggle" onclick="toggleTheme()">🌙</button>

<div class="login-container">
    <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
    </div>
    <h2>Dashboard Wakanders</h2>
    <p>Faça login para acessar o sistema</p>

    <form>
        <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-user absolute left-3 top-3 h-4 w-4 text-gray-400"
                     data-lov-id="src\components\LoginForm.tsx:66:16" data-lov-name="User"
                     data-component-path="src\components\LoginForm.tsx" data-component-line="66"
                     data-component-file="LoginForm.tsx" data-component-name="User"
                     data-component-content="%7B%22className%22%3A%22absolute%20left-3%20top-3%20h-4%20w-4%20text-gray-400%22%7D">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                </svg>
                <input type="text" id="email" placeholder="usuario" required/>
            </div>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <div class="input-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock absolute left-3 top-3 h-4 w-4 text-gray-400" data-lov-id="src\components\LoginForm.tsx:84:16" data-lov-name="Lock" data-component-path="src\components\LoginForm.tsx" data-component-line="84" data-component-file="LoginForm.tsx" data-component-name="Lock" data-component-content="%7B%22className%22%3A%22absolute%20left-3%20top-3%20h-4%20w-4%20text-gray-400%22%7D"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" id="senha" placeholder="********" required/>
            </div>
        </div>
        <p style="color: red; font-size:16px; display: none" id="message-erro">Usuario ou senha incorretos!</p>
        <div type="submit" onclick="login()" onsubmit="login()" class="login-button">Entrar</div>
    </form>
</div>


<script src="../static/js/login.js" th:src="@{/js/login.js}">
</script>
</body>
</html>
