<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Progresso Geral Wakanders</title>

    <!-- Firebase (carrega, mas você não é obrigado a usar agora) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="../../static/css/progresso_wakanders.css" th:href="@{/css/progresso_wakanders.css}">
    <link rel="shortcut icon" href="/imagens/logoWakanda.ico" type="image/x-icon" th:href="@{/imagens/logoWakanda.ico}">
</head>

<body>

<!-- Caixa de erro -->
<div id="errorBox" class="error-box" style="display:none;">
    <h2>Erro Crítico</h2>
    <p id="errorMessage"></p>
    <button id="retryButton" type="button">Tentar Novamente</button>
</div>

<!-- Dashboard -->
<div id="dashboard" class="container">

    <header>
        <h1>
            <img src="https://placehold.co/40x40/553594/ffffff?text=W"/>
            Painel do Mentor Wakanda-AI
        </h1>
        <p id="totalWakanders"></p>
    </header>

    <div class="back-wrapper">
        <a th:href="@{/gameficacao/home}" class="btn-back" aria-label="Voltar para a página inicial">
            ← Voltar para a Home
        </a>
    </div>

    <!-- MÉTRICAS PRINCIPAIS -->
    <section class="metrics">

        <div class="metric-card">
            <p class="metric-title">Média de Sabedorias</p>
            <h2 id="avgWisdoms">-</h2>
        </div>

        <div class="metric-card">
            <p class="metric-title">Nível Médio</p>
            <h2 id="avgLevel">-</h2>
        </div>

    </section>


    <!-- NOVAS MÉTRICAS ADICIONADAS (OPÇÃO D) -->
    <section class="metrics">

        <div class="metric-card">
            <p class="metric-title">Wakanders Com Missões Concluídas </p>
            <h2 id="wakandersComMissoes">-</h2>
        </div>

        <div class="metric-card">
            <p class="metric-title">Wakanders Sem Missões Concluídas</p>
            <h2 id="wakandersSemMissoesConcluidas">-</h2>
        </div>

        <div class="metric-card">
            <p class="metric-title">Wakanders Sem XP</p>
            <h2 id="novosWakanders">-</h2>
        </div>

    </section>


    <!-- Ranking -->
    <section class="ranking">
        <h2>Ranking - Top 5 XP</h2>

        <table>
            <thead>
            <tr>
                <th>Posição</th>
                <th>Wakander</th>
                <th>XP Total</th>
                <th>Missões Concluídas</th>
            </tr>
            </thead>
            <tbody id="leaderboardBody">
            <tr>
                <td colspan="4" style="text-align:center;">Carregando ranking...</td>
            </tr>
            </tbody>
        </table>
    </section>

</div>

<script src="../../static/js/progresso_wakanders.js" th:src="@{/js/progresso_wakanders.js}"></script>
</body>
</html>
