<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Associar Discord</title>
  <link rel="stylesheet" th:href="@{/css/formulario-discord.css}" />
  <link rel="shortcut icon" href="/imagens/logoWakanda.ico" type="image/x-icon" th:href="@{/imagens/logoWakanda.ico}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="dark-mode" th:attr="data-username=${username}, data-iddiscord=${idDiscord}">
  <div class="theme-switch-wrapper">
    <label class="theme-switch" for="checkbox">
      <input type="checkbox" id="checkbox" />
      <div class="slider round"></div>
    </label>
  </div>

  <div class="wrapper">
    <div class="corner-bar"></div>

    <div class="container">
      <h1>Associar Discord</h1>
      <p>Insira seu Email cadastrado na Wakanda</p>

      <form id="discordForm">
        <div class="input-group">
          <label for="email">Email:</label>
          <input type="text" id="email" name="email" placeholder="Digite seu Email" required />
        </div>

        <div id="mensagemErro" class="error-message-container" style="display: none;">
          <span class="icon">⚠️</span>
          <span id="erroTexto"></span>
        </div>
        <div id="mensagemSucesso" class="success-message" style="display: none;"></div>
        <div class="button-group"> <button type="submit">VALIDAR</button>
          <button type="button" id="helpButton" class="help-button" style="display: none;">
            <i class="fab fa-whatsapp"></i> Pedir ajuda
          </button>
        </div>
      </form>
    </div>
  </div>

  <script th:src="@{/js/formulario-discord.js}"></script>
</body>
</html>
